[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "grelmicro-jwt-core"
version = "0.1.0"
description = "Compiled JWT verification core for grelmicro.security.jwt"
license = "MIT"
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
]

[project.urls]
Repository = "https://github.com/grelinfo/grelmicro"

[tool.maturin]
module-name = "grelmicro_jwt_core"
features = ["pyo3/extension-module"]
