name: Reusable Tests
on:
  workflow_call:
    inputs:
      full:
        description: 'Run the full matrix with the slow, integration, and demo tiers.'
        type: boolean
        default: false
      coverage:
        description: >-
          Run the slow and integration tiers on the primary Python and enforce
          the combined 100% total. Implied by `full`. Set it on a pull request
          that touches code, so a coverage regression fails there instead of
          in the next nightly. It leaves the matrix and the demo tier alone.
        type: boolean
        default: false
      ref:
        description: 'Git ref to check out and test. Defaults to the triggering ref.'
        type: string
        default: ''
    secrets:
      CODECOV_TOKEN:
        description: 'Token for uploading coverage and test results to Codecov.'
        required: false
permissions: {}
env:
    UV_FROZEN: 1
jobs:
  test:
    name: Test Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        python: ["3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: ${{ matrix.python }}
      - name: Install dependencies
        uses: $/.github/actions/uv-sync
      - name: Run Unit Tests
        run: pytest -x -m "not integration and not slow" --cov --junitxml=junit.xml -o junit_family=legacy
      - name: Upload Unit Test Coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: "unit,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Unit Test Results to Codecov
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          flags: "unit,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Run Slow Tests
        # Exit code 5 means "no tests collected", which is fine while the
        # slow tier is empty.
        if: ${{ inputs.full || inputs.coverage }}
        run: |
          set +e
          pytest -x -m "slow and not integration" --cov --cov-append --junitxml=junit.xml -o junit_family=legacy
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 5 ]; then
            exit "$status"
          fi
      - name: Upload Slow Test Coverage to Codecov
        if: ${{ inputs.full || inputs.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: "slow,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Slow Test Results to Codecov
        if: ${{ inputs.full || inputs.coverage }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          flags: "slow,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Run Integration Tests
        if: ${{ inputs.full || inputs.coverage }}
        run: pytest -x -m integration --cov --cov-append --junitxml=junit.xml -o junit_family=legacy
      - name: Upload Integration Test Coverage to Codecov
        if: ${{ inputs.full || inputs.coverage }}
        continue-on-error: true
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          flags: "integration,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Upload Integration Test Results to Codecov
        if: ${{ inputs.full || inputs.coverage }}
        continue-on-error: true
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          flags: "integration,python${{ matrix.python }}"
          token: ${{ secrets.CODECOV_TOKEN }}
      - name: Enforce Combined Coverage
        # The 100% claim is about unit + slow + integration together, so only
        # the full path can check it.
        if: ${{ inputs.full || inputs.coverage }}
        run: coverage report --fail-under=100

  lowest:
    name: Test Lowest Versions
    # Every floor in pyproject.toml is a promise, so the tests run on the
    # oldest version each one allows.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      UV_FROZEN: false
      UV_RESOLUTION: lowest-direct
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          activate-environment: true
          python-version: "3.14"
      - name: Install the lowest versions
        uses: $/.github/actions/uv-sync
        with:
          args: --all-extras
      - name: Run Unit Tests
        run: pytest -x -m "not integration and not slow"
      - name: Run Slow and Integration Tests
        if: ${{ inputs.full || inputs.coverage }}
        run: pytest -x -m "slow or integration"

  demo:
    name: Demo Smoke
    if: ${{ inputs.full }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Start the demo stack
        run: docker compose -f examples/fastapi-demo/compose.yml up --build --wait --wait-timeout 240
      - name: Probe the health endpoints
        run: |
          curl -fsS http://localhost:8000/livez
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8000/healthz
      - name: Check the rate limit holds across both workers
        # The demo runs two uvicorn workers and the limiter is Redis backed,
        # so the burst capacity of 5 is the whole deployment's budget. A
        # per-worker limiter would admit about twice as many.
        #
        # The requests go out in parallel. Sent one after another the kernel
        # can hand every one to the same worker, and a per-worker limiter
        # would then admit exactly the capacity too, so the check would pass
        # without ever testing what it claims to.
        run: |
          allowed=$(seq 1 12 | xargs -P 12 -I{} \
            curl -s -o /dev/null -w '%{http_code}\n' \
              "http://localhost:8000/quote?client=smoke" \
            | grep -c '^200$' || true)
          echo "allowed=$allowed of 12"
          if [ "$allowed" -gt 8 ]; then
            echo "::error::rate limit did not hold across workers"
            exit 1
          fi
          if [ "$allowed" -lt 1 ]; then
            echo "::error::rate limiter rejected everything"
            exit 1
          fi
      - name: Dump app logs on failure
        if: failure()
        run: docker compose -f examples/fastapi-demo/compose.yml logs app
      - name: Tear down
        if: always()
        run: docker compose -f examples/fastapi-demo/compose.yml down -v
