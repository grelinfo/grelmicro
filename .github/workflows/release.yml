name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'The version to manually release'
        required: true
      dry_run:
        type: boolean
        description: 'Dry run the release process'
        default: false
permissions: {}
jobs:
  full-checks:
    # Run the full test tier (matrix, slow, integration, demo) before any
    # artifact is built or published.
    #
    # A dry run checks out the dispatch ref instead of the version, because
    # the point of a dry run is to validate a version before its tag exists.
    # `github.ref` is used rather than an empty string, which an expression
    # would treat as false and fall through to the version.
    uses: ./.github/workflows/reusable-tests.yml
    with:
      full: true
      ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  publish-pypi:
    needs: full-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: pypi
    env:
      UV_FROZEN: 1
      RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - name: Set Package Version
        run: uv version -- "$RELEASE_VERSION"
      - name: Build Package
        run: uv build
      - name: Verify Wheel Installs
        run: uv run --no-project -- pip install dist/*.whl
      - name: Attest Build Provenance
        # Signed on GitHub infrastructure separate from this job, which is what
        # SLSA Build L2 asks for. Skipped on a dry run so no attestation is
        # recorded for artifacts that are never published.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/*"
      - name: Verify Build Provenance
        # Proves the attestation exists and validates before anything ships.
        # Without this the SLSA Build L2 claim could quietly stop being true
        # and no run would fail.
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish Package to PyPI
        if: ${{ github.event.inputs.dry_run != 'true' }}
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true
  publish-docs:
    needs: publish-pypi
    uses: ./.github/workflows/reusable-docs.yml
    with:
      ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
      deploy: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
