name: Release
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        type: string
        description: 'The version to manually release'
        required: true
      dry_run:
        type: boolean
        description: 'Dry run the release process'
        default: false
permissions: {}
jobs:
  full-checks:
    # Run the full test tier (matrix, slow, integration, demo) before any
    # artifact is built or published.
    #
    # A dry run checks out the dispatch ref instead of the version, because
    # the point of a dry run is to validate a version before its tag exists.
    # `github.ref` is used rather than an empty string, which an expression
    # would treat as false and fall through to the version.
    uses: ./.github/workflows/reusable-tests.yml
    with:
      full: true
      ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  build-dist:
    # Declares no environment, so a dry run never reaches the credentials that
    # publish. Everything that needs them lives in `publish-pypi`, which the
    # `pypi` environment gates on a release tag and on an approval.
    needs: full-checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      UV_FROZEN: 1
      RELEASE_VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Set Package Version
        run: uv version -- "$RELEASE_VERSION"
      - name: Build Package
        run: uv build
      - name: Verify Wheel Installs
        run: uv run --no-project -- pip install dist/*.whl
      - name: Upload Distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist
          if-no-files-found: error
  publish-pypi:
    needs: build-dist
    if: ${{ github.event.inputs.dry_run != 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: pypi
    steps:
      - name: Download Distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist
      - name: Attest Build Provenance
        # Signed on GitHub infrastructure separate from the job that built
        # these files, which is what SLSA Build L2 asks for.
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Verify Build Provenance
        # Proves the attestation exists and validates before anything ships.
        # Without this the SLSA Build L2 claim could quietly stop being true
        # and no run would fail.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
  publish-docs:
    needs: [build-dist, publish-pypi]
    # `publish-pypi` is skipped on a dry run, and a skipped need would take
    # this with it, so the result is read rather than assumed.
    if: ${{ !cancelled() && needs.build-dist.result == 'success' && needs.publish-pypi.result != 'failure' }}
    uses: ./.github/workflows/reusable-docs.yml
    with:
      ref: ${{ github.event.release.tag_name || (inputs.dry_run && github.ref || inputs.version) }}
      deploy: ${{ github.event.inputs.dry_run != 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
