name: Release JWT Core
# `grelmicro-jwt-core` is the compiled verification core behind
# `grelmicro.security.jwt`. It is a distribution of its own, released on its
# own tag, because it is a per-platform wheel where grelmicro is pure Python
# and because it changes far less often.
#
# The wheel matrix tracks pydantic-core, which grelmicro already requires.
# Anywhere pydantic-core has a wheel and this does not, `grelmicro[jwt]` falls
# back to building from the sdist and needs a Rust toolchain, so a gap here is
# a gap in what the extra can be installed on.
on:
  push:
    tags:
      - 'jwt-core-*'
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        description: 'Build every wheel without publishing'
        default: true
permissions: {}

env:
  CRATE_DIR: rust/grelmicro-jwt
  # No build cache anywhere in this workflow. A cache is writable by any job
  # that can run on the repository, and everything built here is signed and
  # published, so a poisoned cache would reach users as an attested artifact.
  # A release is rare and a cold build is cheap next to that.
  SCCACHE_DISABLE: '1'

jobs:
  linux:
    name: Linux ${{ matrix.platform.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x86_64
          - target: aarch64
          - target: armv7
          - target: i686
          - target: ppc64le
          - target: s390x
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build manylinux wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14 3.13t 3.14t'
          manylinux: auto
          working-directory: ${{ env.CRATE_DIR }}
      - name: Build musllinux wheels
        # Alpine and distroless images are a normal place to run a service,
        # and a glibc wheel does not install there.
        if: ${{ contains(fromJSON('["x86_64", "aarch64", "armv7"]'), matrix.platform.target) }}
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14 3.13t 3.14t'
          manylinux: musllinux_1_2
          working-directory: ${{ env.CRATE_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: ${{ env.CRATE_DIR }}/dist

  macos:
    name: macOS ${{ matrix.platform.target }}
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: aarch64
          - target: x86_64
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14 3.13t 3.14t'
          working-directory: ${{ env.CRATE_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: ${{ env.CRATE_DIR }}/dist

  windows:
    name: Windows ${{ matrix.platform.target }}
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - target: x64
          - target: x86
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --interpreter '3.12 3.13 3.14 3.13t 3.14t'
          working-directory: ${{ env.CRATE_DIR }}
      - name: Upload wheels
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: ${{ env.CRATE_DIR }}/dist

  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
          working-directory: ${{ env.CRATE_DIR }}
      - name: Upload sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wheels-sdist
          path: ${{ env.CRATE_DIR }}/dist

  smoke:
    name: Verify a wheel verifies a token
    needs: [linux]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download wheels
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wheels-linux-x86_64
          path: dist
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false
      - name: Verify the built wheel against the suite
        # A wheel that imports is not a wheel that verifies. This runs the
        # security tests against the artifact that would be published, not
        # against a core rebuilt from the working tree.
        run: |
          uv sync --all-extras --group dev
          uv pip install --reinstall --no-deps dist/grelmicro_jwt_core-*-cp312-cp312-manylinux*_x86_64*.whl
          uv run --no-sync pytest tests/security -q

  publish:
    name: Publish to PyPI
    needs: [linux, macos, windows, sdist, smoke]
    if: ${{ startsWith(github.ref, 'refs/tags/jwt-core-') && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    environment: pypi
    steps:
      - name: Download every artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"
      - name: Verify Build Provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
