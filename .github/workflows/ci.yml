name: CI
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Nightly full run: matrix, slow, integration, and demo tiers.
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
    UV_FROZEN: 1
jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A workflow change re-runs every tier. Code includes the snippet
          # and README tests, which live under tests/ and run in the test job.
          filters: |
            code:
              - 'grelmicro/**'
              - 'tests/**'
              - 'examples/**'
              - 'pyproject.toml'
              - 'uv.lock'
              - '.python-version'
              - '.github/workflows/**'
            docs:
              - 'docs/**'
              - 'mkdocs.yml'
              - 'README.md'
              - '.github/workflows/**'
            workflows:
              - '.github/workflows/**'

  lint:
    name: Lint
    needs: changes
    # Path filtering applies to pull requests only. Pushes, the nightly
    # schedule, and manual dispatch always run, so a mis-filtered PR is still
    # covered once it lands on main.
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          activate-environment: true
      - name: Install dependencies
        run: uv sync --all-extras

      - name: Run Ty
        # Single-threaded so cycle resolution is deterministic. ty resolves
        # inference cycles in whichever order threads reach them, which can
        # flip a diagnostic on unchanged code (astral-sh/ty#1670).
        env:
          TY_MAX_PARALLELISM: "1"
        run: uv run ty check

      - name: Run Mypy
        run: uv run mypy

  docs:
    name: Docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true
          activate-environment: true
      - name: Install dependencies
        run: uv sync --group docs
      - name: Build docs (strict)
        # --strict fails on broken links and missing nav; check_paths in
        # mkdocs.yml fails on missing snippet includes. Together they catch
        # doc and snippet drift that the snippet-execution tests cannot see.
        run: uv run mkdocs build --strict

  workflow-lint:
    name: Workflow Lint
    needs: changes
    # zizmor only analyzes workflow files, so its result cannot change unless
    # they do. Path filtering applies to pull requests only; pushes, the
    # nightly schedule, and manual dispatch always run it.
    if: ${{ needs.changes.outputs.workflows == 'true' || github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2

  tests:
    name: Tests
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' || github.event_name != 'pull_request' }}
    # PRs and pushes to main run the unit tier on Python 3.12, plus the slow
    # and integration tiers whenever code changed, because the 100% coverage
    # total is only measurable once all three have run. The nightly schedule
    # and manual dispatch run the full tier (matrix, demo). Release runs the
    # full tier before publishing.
    uses: ./.github/workflows/reusable-tests.yml
    with:
      full: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
      coverage: ${{ needs.changes.outputs.code == 'true' }}
    permissions:
      contents: read
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  check:
    name: CI Green
    # Single aggregation gate: branch protection needs only this check. It
    # passes when every job either succeeded or was legitimately path-skipped,
    # and fails if any job failed. `always()` so it still reports when an
    # upstream job is skipped.
    if: ${{ always() }}
    needs:
      - changes
      - lint
      - docs
      - workflow-lint
      - tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require all jobs to pass
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # v1.2.2
        with:
          jobs: ${{ toJSON(needs) }}
          allowed-skips: lint, docs, workflow-lint, tests
