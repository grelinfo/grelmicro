version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Load-bearing deps: require human review for major bumps.
      - dependency-name: "fastapi"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "pydantic-settings"
        update-types: ["version-update:semver-major"]
      - dependency-name: "uvicorn"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "⬆️ "
      prefix-development: "⬆️ "

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "⬆️ ci: "

  # The compiled JWT core. Its dependencies include the crypto provider, so a
  # security fix there only reaches users through a grelmicro-core release:
  # merging the bump is the first step, cutting core-* is the second.
  - package-ecosystem: "cargo"
    directory: "/rust/grelmicro-core"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
      semver-major-days: 14
    groups:
      rust-minor-patch:
        update-types:
          - "minor"
          - "patch"
    commit-message:
      prefix: "⬆️ "

  - package-ecosystem: "docker"
    directory: "/examples/fastapi-demo"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: "⬆️ "
