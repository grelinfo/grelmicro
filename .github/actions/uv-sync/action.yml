name: Sync dependencies
description: >-
  Run uv sync, taking grelmicro-core from PyPI when rust/grelmicro-core is
  identical to the sdist PyPI holds for its version, so an untouched crate is
  never compiled.
inputs:
  args:
    description: Extra arguments passed to uv sync, such as --all-extras.
    required: false
    default: ''
runs:
  using: composite
  steps:
    - name: Sync, reusing the released core when the crate is unchanged
      shell: bash
      env:
        SYNC_ARGS: ${{ inputs.args }}
      run: |
        read -ra args <<< "$SYNC_ARGS"
        version="$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' rust/grelmicro-core/Cargo.toml)"

        # The published sdist holds the crate files byte for byte, so an
        # unchanged crate is exactly what the wheels were built from. An edit
        # under rust/grelmicro-core, an unreleased version, or PyPI being
        # unreachable all fall through to building from this checkout.
        if uv run --no-project python tools/core_release.py released; then
          echo "rust/grelmicro-core matches ${version} on PyPI: installing the published wheel"
          uv sync "${args[@]}" --no-install-package grelmicro-core
          # Wheels only. Falling back to the sdist would compile the crate,
          # which is the one thing this path exists to avoid.
          uv pip install --no-deps --only-binary grelmicro-core "grelmicro-core==${version}"
        else
          echo "rust/grelmicro-core differs from PyPI or is unreleased: building it"
          # Install the toolchain rust-toolchain.toml pins before cargo asks
          # for it. rustup still installs a missing pinned toolchain on first
          # use, but has deprecated doing so.
          rustup toolchain install
          uv sync "${args[@]}"
        fi
